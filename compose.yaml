services:

  postgres:
    image: postgres:17-alpine
    container_name: shop_epower_postgres

    environment:
      POSTGRES_DB: ${PG_NAME}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PG_USER} -d ${PG_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


  redis:
    image: redis:7-alpine
    container_name: shop_epower_redis

    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
      ]

    ports:
      - "6380:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s


  web:
    build:
      context: .

    image: shop-epower-web
    container_name: shop_epower_web

    command:
      [
        "python",
        "manage.py",
        "runserver",
        "0.0.0.0:8000",
      ]

    env_file:
      - .env

    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3

    ports:
      - "8000:8000"

    volumes:
      - ./src:/app/src

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/shop/', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  celery_worker:
    build:
      context: .

    image: shop-epower-web
    container_name: shop_epower_celery_worker

    command:
      [
        "celery",
        "-A",
        "config",
        "worker",
        "-l",
        "info",
        "-E",
      ]

    env_file:
      - .env

    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3

    volumes:
      - ./src:/app/src

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy


  celery_beat:
    build:
      context: .

    image: shop-epower-web
    container_name: shop_epower_celery_beat

    command:
      [
        "celery",
        "-A",
        "config",
        "beat",
        "-l",
        "info",
        "--scheduler",
        "django_celery_beat.schedulers:DatabaseScheduler",
      ]

    env_file:
      - .env

    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3

    volumes:
      - ./src:/app/src

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      web:
        condition: service_healthy


  flower:
    build:
      context: .

    image: shop-epower-web
    container_name: shop_epower_flower

    command:
      [
        "celery",
        "-A",
        "config",
        "flower",
        "--address=0.0.0.0",
        "--port=5555",
      ]

    env_file:
      - .env

    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3

    ports:
      - "5555:5555"

    volumes:
      - ./src:/app/src

    depends_on:
      redis:
        condition: service_healthy

      celery_worker:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5555/', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


volumes:

  postgres_data:

  redis_data: