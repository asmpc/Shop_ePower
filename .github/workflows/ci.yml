name: Shop_ePower CI

on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Django CI

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: shop_epower_ci
          POSTGRES_PASSWORD: shop_epower_ci_password
          POSTGRES_DB: shop_epower_ci

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U shop_epower_ci -d shop_epower_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: "True"

      PG_HOST: "127.0.0.1"
      PG_USER: "shop_epower_ci"
      PG_PASS: "shop_epower_ci_password"
      PG_NAME: "shop_epower_ci"
      PG_PORT: "5432"

      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_LIFETIME_MINUTES: "15"
      REFRESH_TOKEN_LIFETIME_MINUTES: "43200"

      SHOP_BASE_CURRENCY: "BYN"

      CELERY_BROKER_URL: "redis://127.0.0.1:6379/2"
      CELERY_RESULT_BACKEND: "redis://127.0.0.1:6379/3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: python -m pip install "poetry==2.4.1"

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run Django system checks
        run: poetry run python src/manage.py check

      - name: Check PostgreSQL connection
        run: >
          poetry run python src/manage.py shell -c
          "from django.db import connection;
          connection.ensure_connection();
          print(connection.settings_dict['HOST']);
          print('Database connection OK')"

      - name: Check Redis connection
        run: >
          poetry run python -c
          "import os, redis;
          client = redis.Redis.from_url(os.environ['CELERY_BROKER_URL']);
          print('Redis ping:', client.ping())"

      - name: Check for missing migrations
        run: poetry run python src/manage.py makemigrations --check --dry-run

      - name: Run automated tests
        working-directory: src
        run: poetry run python manage.py test

  quality:
    name: Ruff Quality

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: python -m pip install "poetry==2.4.1"

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run Ruff
        run: poetry run ruff check src

  docker-build:
    needs:
      - test
      - quality

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/shop_epower
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: |
            shop-epower:ci
            shop-epower-web:latest
          cache-from: type=gha,scope=shop-epower-ci
          cache-to: type=gha,mode=max,scope=shop-epower-ci

      - name: Create Docker Compose CI environment
        run: |
          cat > .env <<'EOF'
          SECRET_KEY=django-insecure-ci-compose-check
          DEBUG=True

          PG_HOST=postgres
          PG_USER=shop_epower_ci
          PG_PASS=shop_epower_ci_password
          PG_NAME=shop_epower_ci
          PG_PORT=5432

          JWT_ALGORITHM=HS256
          ACCESS_TOKEN_LIFETIME_MINUTES=15
          REFRESH_TOKEN_LIFETIME_MINUTES=43200

          SHOP_BASE_CURRENCY=BYN

          CELERY_BROKER_URL=redis://redis:6379/2
          CELERY_RESULT_BACKEND=redis://redis:6379/3
          EOF

          docker compose config --quiet

      - name: Run Django checks inside Docker image
        run: |
          docker run --rm \
            --env SECRET_KEY=django-insecure-ci-docker-check \
            --env DEBUG=True \
            --env PG_HOST=127.0.0.1 \
            --env PG_USER=shop_epower_ci \
            --env PG_PASS=shop_epower_ci_password \
            --env PG_NAME=shop_epower_ci \
            --env PG_PORT=5432 \
            --env JWT_ALGORITHM=HS256 \
            --env ACCESS_TOKEN_LIFETIME_MINUTES=15 \
            --env REFRESH_TOKEN_LIFETIME_MINUTES=43200 \
            --env SHOP_BASE_CURRENCY=BYN \
            --env CELERY_BROKER_URL=redis://127.0.0.1:6379/2 \
            --env CELERY_RESULT_BACKEND=redis://127.0.0.1:6379/3 \
            shop-epower:ci \
            python manage.py check

      - name: Run container smoke test
        run: |
          docker run --detach \
            --name shop-epower-smoke \
            --publish 8000:8000 \
            --env SECRET_KEY=django-insecure-ci-docker-check \
            --env DEBUG=True \
            --env PG_HOST=127.0.0.1 \
            --env PG_USER=shop_epower_ci \
            --env PG_PASS=shop_epower_ci_password \
            --env PG_NAME=shop_epower_ci \
            --env PG_PORT=5432 \
            --env JWT_ALGORITHM=HS256 \
            --env ACCESS_TOKEN_LIFETIME_MINUTES=15 \
            --env REFRESH_TOKEN_LIFETIME_MINUTES=43200 \
            --env SHOP_BASE_CURRENCY=BYN \
            --env CELERY_BROKER_URL=redis://127.0.0.1:6379/2 \
            --env CELERY_RESULT_BACKEND=redis://127.0.0.1:6379/3 \
            shop-epower:ci \
            python -c "from wsgiref.simple_server import make_server; from config.wsgi import application; make_server('0.0.0.0', 8000, application).serve_forever()"

          cleanup() {
            status=$?

            if [ "$status" -ne 0 ]; then
              echo "Container logs:"
              docker logs shop-epower-smoke || true
            fi

            docker rm --force shop-epower-smoke \
              > /dev/null 2>&1 || true
          }

          trap cleanup EXIT

          for attempt in {1..15}; do
            if curl \
              --fail \
              --silent \
              --output /dev/null \
              http://127.0.0.1:8000/admin/login/; then
              echo "Container smoke test passed."
              exit 0
            fi

            echo "Waiting for container: ${attempt}/15"
            sleep 2
          done

          echo "Container smoke test failed."
          exit 1

      - name: Run Docker Compose integration test
        run: |
          cleanup() {
            status=$?

            if [ "$status" -ne 0 ]; then
              echo "Docker Compose services:"
              docker compose ps || true

              echo "Docker Compose logs:"
              docker compose logs --no-color || true
            fi

            docker compose down \
              --volumes \
              --remove-orphans \
              > /dev/null 2>&1 || true

            exit "$status"
          }

          trap cleanup EXIT

          echo "Starting PostgreSQL and Redis..."

          docker compose up \
            --detach \
            --wait \
            --no-build \
            postgres \
            redis

          echo "Applying database migrations..."

          docker compose run \
            --rm \
            --no-deps \
            web \
            python manage.py migrate --noinput

          echo "Starting the full Docker Compose stack..."

          docker compose up \
            --detach \
            --wait \
            --wait-timeout 120 \
            --no-build

          echo "Checking Django web service..."

          curl \
            --fail \
            --silent \
            --show-error \
            --output /dev/null \
            http://127.0.0.1:8000/admin/login/

          echo "Checking Flower..."

          curl \
            --fail \
            --silent \
            --show-error \
            --output /dev/null \
            http://127.0.0.1:5555/

          echo "Checking Celery worker..."

          docker compose exec -T celery_worker \
            celery -A config inspect ping --timeout=10 \
            | tee /tmp/celery-ping.txt

          grep --quiet "pong" /tmp/celery-ping.txt

          echo "Checking Celery Beat..."

          docker compose ps \
            --status running \
            --services \
            | grep --quiet --line-regexp celery_beat

          echo "Full Docker Compose integration test passed."

      - name: Publish Docker image to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=shop-epower-ci
          cache-to: type=gha,mode=max,scope=shop-epower-ci