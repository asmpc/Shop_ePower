[project]
name = "shop-epower"
version = "0.1.0"
description = "Enterprise-ready B2B/B2C platform for electrical equipment"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django (==6.0.5)",
    "django-environ (==0.13.0)",
    "psycopg2-binary (==2.9.12)",
    "djangorestframework (==3.17.1)",
    "djangorestframework-simplejwt (==5.5.1)",
    "drf-spectacular (==0.29.0)",
    "django-filter (==25.2)",
    "crispy-bootstrap5 (==2026.3)",
    "django-crispy-forms (==2.6)",
    "pillow (==12.2.0)",
    "reportlab (==5.0.0)",
    "celery (==5.6.3)",
    "redis (==6.4.0)",
    "django-celery-beat (==2.9.0)",
    "flower (==2.0.1)",
    "django-extensions (==4.1)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "ipython (==9.13.0)",
    "ruff (==0.16.0)"
]

[tool.ruff]
required-version = "==0.16.0"
target-version = "py314"
src = ["src"]
extend-exclude = [
    "migrations",
]

[tool.ruff.lint]
select = [
    "E9",
    "F401",
    "F63",
    "F7",
    "F82",
    "I",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
